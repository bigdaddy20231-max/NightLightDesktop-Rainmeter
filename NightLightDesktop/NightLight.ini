[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureInit "Run"]

[Variables]
Strength=50
Power=0
Accent=255,155,55
Dim=65,65,65

[MeasureInit]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#NightLight.ps1" status
State=Hide
OutputType=ANSI
FinishAction=[!SetVariable Strength "[MeasureInit]"][!UpdateMeter *][!Redraw]
DynamicVariables=1

[MeasureToggle]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#NightLight.ps1" toggle
State=Hide
FinishAction=[!CommandMeasure MeasureInit "Run"]

[MeasureSet]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#NightLight.ps1" set #Strength#
State=Hide
DynamicVariables=1

[MeasureCalc]
Measure=Calc
Formula=#Strength#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,130,40,9 | Fill Color 18,18,18,210 | StrokeWidth 1 | Stroke Color 80,80,80,150
MouseScrollUpAction=[!SetOption MeasureCalc Formula "Clamp(#Strength#+5,0,100)"][!UpdateMeasure MeasureCalc][!SetVariable Strength "[MeasureCalc]"][!UpdateMeter *][!Redraw][!CommandMeasure MeasureSet "Run"]
MouseScrollDownAction=[!SetOption MeasureCalc Formula "Clamp(#Strength#-5,0,100)"][!UpdateMeasure MeasureCalc][!SetVariable Strength "[MeasureCalc]"][!UpdateMeter *][!Redraw][!CommandMeasure MeasureSet "Run"]
DynamicVariables=1

[MeterValue]
Meter=String
Text=#Strength#%
X=65
Y=3
W=50
StringAlign=Center
FontFace=Segoe UI Semibold
FontSize=10
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureToggle "Run"]
ToolTipText=تشغيل / إطفاء الضوء الليلي

[StyleSegment]
Meter=Shape
Y=25
W=10
H=7
DynamicVariables=1

[Seg0]
MeterStyle=StyleSegment
X=6
Shape=Rectangle 0,0,10,7,2 | Fill Color #Accent# | StrokeWidth 0
LeftMouseUpAction=[!SetVariable Strength 0][!UpdateMeter *][!Redraw][!CommandMeasure MeasureSet "Run"]
